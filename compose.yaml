name: switchyard
services:
  nats-init:
    profiles: [async]
    image: nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    user: "0:0"
    entrypoint: [/bin/sh, -c, "mkdir -p /data/jetstream && chown 1000:1000 /data /data/jetstream"]
    volumes:
      - nats_data:/data
    mem_limit: 32m
  nats:
    profiles: [async]
    image: nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    user: "1000:1000"
    command: [-c, /etc/nats/nats.conf]
    volumes:
      - nats_data:/data
      - ./deploy/nats/nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "127.0.0.1:${NATS_PORT:-42229}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-18229}:8222"
    depends_on:
      nats-init:
        condition: service_completed_successfully
    mem_limit: 256m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  worker:
    profiles: [async]
    image: switchyard-api:local
    pull_policy: never
    entrypoint: [/app/worker]
    environment:
      DATABASE_URL: postgres://switchyard:${POSTGRES_PASSWORD:?required}@postgres:5432/switchyard?sslmode=disable
      NATS_URL: nats://nats:4222
      DB_MAX_CONNS: "6"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped
  redis:
    # Disposable cache; make up enables this profile.
    profiles: [cache]
    image: redis:8.10.2@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
    user: redis:redis
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 96mb, --maxmemory-policy, allkeys-lru]
    ports:
      - "127.0.0.1:${REDIS_PORT:-63799}:6379"
    mem_limit: 128m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: switchyard
      POSTGRES_USER: switchyard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchyard -d switchyard"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    image: switchyard-api:local
    pull_policy: never
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://switchyard:${POSTGRES_PASSWORD:?required}@postgres:5432/switchyard?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    image: switchyard-api:local
    environment:
      DATABASE_URL: postgres://switchyard:${POSTGRES_PASSWORD:?required}@postgres:5432/switchyard?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
      DB_MAX_CONNS: "10"
      SWITCHYARD_ORIGIN: ${SWITCHYARD_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    image: switchyard-web:local
    environment:
      SWITCHYARD_API_URL: http://api:8080
      SWITCHYARD_ORIGIN: ${SWITCHYARD_ORIGIN:-http://localhost:3000}
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres_data:
  nats_data:
