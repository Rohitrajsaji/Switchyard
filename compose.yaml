name: switchyard
services:
  redis:
    # Opt in while M6 is being built; the MVP remains a three-service stack.
    profiles: [cache]
    image: redis:8.10.2@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
    user: redis:redis
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 96mb, --maxmemory-policy, allkeys-lru]
    ports:
      - "127.0.0.1:${REDIS_PORT:-63799}:6379"
    mem_limit: 128m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: switchyard
      POSTGRES_USER: switchyard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchyard -d switchyard"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    image: switchyard-api:local
    pull_policy: never
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://switchyard:${POSTGRES_PASSWORD:?required}@postgres:5432/switchyard?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    image: switchyard-api:local
    environment:
      DATABASE_URL: postgres://switchyard:${POSTGRES_PASSWORD:?required}@postgres:5432/switchyard?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
      DB_MAX_CONNS: "10"
      SWITCHYARD_ORIGIN: ${SWITCHYARD_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    image: switchyard-web:local
    environment:
      SWITCHYARD_API_URL: http://api:8080
      SWITCHYARD_ORIGIN: ${SWITCHYARD_ORIGIN:-http://localhost:3000}
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres_data:
