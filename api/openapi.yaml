openapi: 3.1.0
info:
  title: Switchyard API
  version: 0.0.4
  description: >-
    Modular Go experimentation platform. Management requires human sessions.
    Production configuration is read-only until the approval milestone.
    Application keys cannot authorize management operations.
servers:
  - url: http://localhost:8080
security:
  - session: []
paths:
  /health/live:
    get:
      security: []
      summary: Process liveness
      responses:
        '200': {description: Process alive}
  /health/ready:
    get:
      security: []
      summary: Database and release schema readiness
      responses:
        '200': {description: Ready}
        '503': {description: Database or schema unavailable}
  /v1/session:
    post:
      security: []
      summary: Log in and create a 24-hour opaque session
      description: >-
        Requires configured Origin. Sets an HttpOnly SameSite=Strict cookie.
        Returns a CSRF token for subsequent session mutations.
        Ten login attempts per minute per direct peer IP; no forwarded IP trust.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, maxLength: 72}
      responses:
        '200':
          description: Authenticated; session token is only in Set-Cookie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {description: Rate limited; respect Retry-After}
    get:
      summary: Current user and CSRF token after reload
      responses:
        '200':
          description: Current session; never cache
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    delete:
      summary: Revoke current session
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: Session revoked and cookie expired}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/projects:
    get:
      summary: List up to 100 projects the current human belongs to
      responses:
        '200':
          description: Visible projects
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Project'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Create a project and its three environments
      description: Developer/admin only; creator becomes a member. Audited atomically.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/users:
    post:
      summary: Create an organization user (admin only)
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, role]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, minLength: 12, maxLength: 72, description: Limits apply to UTF-8 byte length for bcrypt}
                role: {type: string, enum: [viewer, developer, admin]}
      responses:
        '201':
          description: Created user; password never returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Actor'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Email already exists}
  /v1/projects/{project}/environments:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      summary: List development, staging and production identifiers
      responses:
        '200':
          description: Environments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: {type: string}
                    name: {type: string, enum: [development, staging, production]}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/projects/{project}/members:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      summary: Grant project membership (admin member only)
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id]
              properties:
                user_id: {type: string}
      responses:
        '204': {description: Membership created and audited}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Membership already exists}
  /v1/projects/{project}/application-keys:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      summary: Create a scoped application key (development/staging only in MVP)
      description: Token is returned once, stored only as a SHA-256 hash, and excluded from audit details.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, environment_id, permissions]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                environment_id: {type: string}
                permissions:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items: {type: string, enum: [evaluate, 'events:write', 'config:read']}
      responses:
        '201':
          description: One-time key response
          content:
            application/json:
              schema:
                type: object
                required: [id, token, permissions]
                properties:
                  id: {type: string}
                  token: {type: string}
                  permissions: {type: array, items: {type: string}}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/projects/{project}/application-keys/{key}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - name: key
        in: path
        required: true
        schema: {type: string}
    delete:
      summary: Revoke an application key (developer/admin member)
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: Revoked and audited}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Unknown or already revoked key}
  /v1/projects/{project}/audit:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      summary: List up to 100 audit records in descending ID order
      parameters:
        - name: before_id
          in: query
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Append-only application history
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/projects/{project}/flags:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      summary: List up to 100 configured flags in an environment
      parameters:
        - $ref: '#/components/parameters/EnvironmentQuery'
      responses:
        '200':
          description: Current immutable definitions
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FlagDefinition'}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create a boolean or JSON flag and its initial environment revision
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FlagCreate'}
      responses:
        '201':
          description: Created immutable revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlagDefinition'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Flag key already exists in project}
  /v1/projects/{project}/flags/{key}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/FlagKey'
    get:
      summary: Read the current flag definition
      parameters:
        - $ref: '#/components/parameters/EnvironmentQuery'
      responses:
        '200':
          description: Definition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlagDefinition'}
        '404': {description: Flag is not configured in this environment}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      summary: Append a revision with optimistic concurrency
      description: >-
        Full configuration replacement. expected_revision=0 initializes another
        development/staging environment for an existing project flag.
        Salt is server-fixed; production writes are denied in MVP.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FlagUpdate'}
      responses:
        '200':
          description: New immutable revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlagDefinition'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Stale revision or incompatible active experiment}
  /v1/projects/{project}/flags/{key}/preview:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/FlagKey'
    post:
      summary: Read-only human evaluation preview; never creates exposure
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EvaluationInput'}
      responses:
        '200':
          description: Evaluated decision; path determines project/key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationResult'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/evaluate:
    post:
      security:
        - application: []
      summary: Evaluate a flag using an environment-scoped application key
      description: >-
        No exposure or per-user database write. A known flag requires fallback
        to match its emergency safe value; unknown flags return the declared
        typed fallback. decision_id is correlation context, not proof of exposure.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplicationEvaluationInput'}
      responses:
        '200':
          description: Typed decision or explicit missing-flag fallback
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationResult'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/projects/{project}/experiments:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      summary: List the 100 most recent runs in an environment
      parameters:
        - $ref: '#/components/parameters/EnvironmentQuery'
      responses:
        '200':
          description: Runs ordered by creation time descending
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ExperimentRun'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create a draft experiment with immutable population and treatments
      description: >-
        Developer/admin project members only, development/staging only in MVP.
        Requires an existing enabled flag configuration without a standalone rollout.
        Draft and paused runs reserve the flag/environment until completed.
        Creation does not start evaluation or change the flag revision.
        Request body is limited to 64 KiB.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExperimentCreate'}
      responses:
        '201':
          description: Draft created and audited atomically
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExperimentRun'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Flag configuration not found}
        '409': {description: Revision conflict or flag already reserved, killed or in standalone rollout}
  /v1/projects/{project}/experiments/{run}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Run'
    get:
      summary: Inspect a current or historical run
      responses:
        '200':
          description: Frozen run definition and current flag configuration revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExperimentRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Run not found in this project}
  /v1/projects/{project}/experiments/{run}/transitions:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Run'
    post:
      summary: Start, pause, resume or complete a run
      description: >-
        Use action start to resume a paused run. No treatment edits are accepted.
        Start/resume attaches the immutable experiment; pause/complete detaches it.
        Every successful transition creates a flag revision and audit record in one transaction.
        Completed runs cannot restart; killed flags cannot start/resume.
        Send configuration_revision as expected_revision, rather than definition.revision.
        Request body is limited to 4 KiB.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, action, reason]
              properties:
                expected_revision: {type: integer, minimum: 1}
                action: {type: string, enum: [start, pause, complete]}
                reason: {type: string, minLength: 1, maxLength: 512}
      responses:
        '200':
          description: Updated lifecycle and current configuration revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExperimentRun'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Run not found in this project}
        '409': {description: Stale revision, invalid state transition or disabled flag}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: switchyard_session}
    application: {type: http, scheme: bearer, bearerFormat: opaque-scoped-application-key}
  parameters:
    Project: {name: project, in: path, required: true, schema: {type: string}}
    Origin: {name: Origin, in: header, required: true, schema: {type: string}, description: Must equal configured SWITCHYARD_ORIGIN}
    CSRF: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}, description: Token from current session response}
    EnvironmentQuery: {name: environment_id, in: query, required: true, schema: {type: string}}
    FlagKey: {name: key, in: path, required: true, schema: {type: string}}
    Run: {name: run, in: path, required: true, schema: {type: string}}
  schemas:
    Variant:
      type: object
      additionalProperties: false
      required: [id, ordinal, weight_bp, value]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        ordinal: {type: integer, minimum: 0}
        weight_bp: {type: integer, minimum: 1, maximum: 10000}
        value: {$ref: '#/components/schemas/FlagValue'}
      description: Unique IDs and ordinals; all weights must sum to 10000; values match the flag type
    ExperimentAssignment:
      type: object
      required: [run_id, eligibility_salt, variant_salt, traffic_bp, variants]
      properties:
        run_id: {type: string}
        eligibility_salt: {type: string}
        variant_salt: {type: string}
        traffic_bp: {type: integer, minimum: 0, maximum: 10000}
        variants: {type: array, minItems: 2, maxItems: 10, items: {$ref: '#/components/schemas/Variant'}}
    ExperimentCreate:
      type: object
      additionalProperties: false
      required: [environment_id, flag_key, expected_revision, name, control_variant_id, traffic_bp, variants, reason]
      properties:
        environment_id: {type: string}
        flag_key: {type: string}
        expected_revision: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 128}
        control_variant_id: {type: string, description: Must identify one supplied variant}
        traffic_bp: {type: integer, minimum: 0, maximum: 10000}
        variants: {type: array, minItems: 2, maxItems: 10, items: {$ref: '#/components/schemas/Variant'}}
        reason: {type: string, minLength: 1, maxLength: 512}
    ExperimentRun:
      type: object
      required: [id, name, state, control_variant_id, definition, configuration_revision, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        state: {type: string, enum: [draft, running, paused, completed]}
        control_variant_id: {type: string}
        definition: {$ref: '#/components/schemas/FlagDefinition'}
        configuration_revision: {type: integer, minimum: 1, description: Current flag revision to send in a lifecycle mutation}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
      description: Definition is immutable and includes the run assignment; its revision is the original creation revision
    FlagValue:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, data]
          properties:
            type: {const: boolean}
            data: {type: boolean}
        - type: object
          additionalProperties: false
          required: [type, data]
          properties:
            type: {const: json}
            data: {}
      description: Explicit typed value; at most 16 KiB of serialized JSON data
    TargetRule:
      type: object
      additionalProperties: false
      required: [attribute, operator, values, value]
      properties:
        attribute: {type: string, maxLength: 64}
        operator: {type: string, enum: [eq, in, gt, gte, lt, lte]}
        values:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: [string, boolean, number]}
        value: {$ref: '#/components/schemas/FlagValue'}
      description: Ordered primitive targeting; sensitive attribute names are denied
    Rollout:
      type: object
      additionalProperties: false
      required: [traffic_bp, value]
      properties:
        traffic_bp: {type: integer, minimum: 0, maximum: 10000}
        salt: {type: string, description: Omit or use standalone-v1; server fixes this across revisions}
        value: {$ref: '#/components/schemas/FlagValue'}
    FlagConfiguration:
      type: object
      required: [default, safe]
      properties:
        default: {$ref: '#/components/schemas/FlagValue'}
        safe: {$ref: '#/components/schemas/FlagValue'}
        killed: {type: boolean, default: false}
        rules: {type: [array, 'null'], maxItems: 50, items: {$ref: '#/components/schemas/TargetRule'}}
        rollout:
          anyOf:
            - $ref: '#/components/schemas/Rollout'
            - type: 'null'
    FlagCreate:
      allOf:
        - $ref: '#/components/schemas/FlagConfiguration'
        - type: object
          required: [environment_id, key, type, reason]
          properties:
            environment_id: {type: string}
            key: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
            type: {type: string, enum: [boolean, json]}
            reason: {type: string, minLength: 1, maxLength: 512}
      unevaluatedProperties: false
    FlagUpdate:
      allOf:
        - $ref: '#/components/schemas/FlagConfiguration'
        - type: object
          required: [environment_id, expected_revision, reason]
          properties:
            environment_id: {type: string}
            expected_revision: {type: integer, minimum: 0}
            reason: {type: string, minLength: 1, maxLength: 512}
      unevaluatedProperties: false
    FlagDefinition:
      allOf:
        - $ref: '#/components/schemas/FlagConfiguration'
        - type: object
          required: [project_id, environment_id, flag_id, key, type, revision]
          properties:
            project_id: {type: string}
            environment_id: {type: string}
            flag_id: {type: string}
            key: {type: string}
            type: {type: string, enum: [boolean, json]}
            revision: {type: integer, minimum: 1}
            experiment: {$ref: '#/components/schemas/ExperimentAssignment'}
    EvaluationInput:
      type: object
      additionalProperties: false
      required: [environment_id, user_id, fallback]
      properties:
        project_id: {type: string, description: Required for application evaluation; preview uses path}
        key: {type: string, description: Required for application evaluation; preview uses path}
        environment_id: {type: string}
        user_id: {type: string, minLength: 1, maxLength: 256}
        attributes: {type: [object, 'null'], maxProperties: 100, additionalProperties: {}}
        fallback: {$ref: '#/components/schemas/FlagValue'}
    EvaluationResult:
      type: object
      required: [value, reason, revision, decision_id]
      properties:
        value: {$ref: '#/components/schemas/FlagValue'}
        reason: {type: string, enum: [kill_switch, targeting, experiment, rollout, default, flag_not_found]}
        revision: {type: integer, minimum: 0}
        decision_id: {type: string}
        run_id: {type: string}
        variant_id: {type: string}
    ApplicationEvaluationInput:
      allOf:
        - $ref: '#/components/schemas/EvaluationInput'
        - type: object
          required: [project_id, key]
    Actor:
      type: object
      required: [id, email, role]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [viewer, developer, admin]}
    Session:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user: {$ref: '#/components/schemas/Actor'}
        csrf_token: {type: string}
        expires_at: {type: string, format: date-time}
    Project:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    AuditEntry:
      type: object
      required: [id, actor_id, source, project_id, action, request_id, reason, details, created_at]
      properties:
        id: {type: integer}
        actor_id: {type: string}
        source: {type: string, enum: [human, application, system, agent]}
        project_id: {type: string}
        environment_id: {type: string}
        action: {type: string}
        request_id: {type: string}
        reason: {type: string}
        before_revision: {type: integer}
        after_revision: {type: integer}
        details: {type: object}
        created_at: {type: string, format: date-time}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        request_id: {type: string}
  responses:
    Unauthorized:
      description: Invalid, expired or revoked session
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Permission, origin, CSRF or scope denied
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Invalid:
      description: Invalid input; unknown JSON fields, multiple documents and null bodies are rejected
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
