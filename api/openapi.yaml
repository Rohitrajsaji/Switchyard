openapi: 3.1.0
info:
  title: Switchyard API
  version: 0.1.1
  description: >-
    Modular Go experimentation platform. Management requires human sessions.
    Production configuration is read-only until the approval milestone.
    Application keys cannot authorize management operations.
servers:
  - url: http://localhost:8080
security:
  - session: []
paths:
  /health/live:
    get:
      security: []
      summary: Process liveness
      responses:
        '200': {description: Process alive}
  /health/ready:
    get:
      security: []
      summary: Database and release schema readiness
      responses:
        '200': {description: Ready}
        '503': {description: Database or schema unavailable}
  /v1/session:
    post:
      security: []
      summary: Log in and create a 24-hour opaque session
      description: >-
        Requires configured Origin. Sets an HttpOnly SameSite=Strict cookie.
        Returns a CSRF token for subsequent session mutations.
        Ten login attempts per minute per direct peer IP; no forwarded IP trust.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, maxLength: 72}
      responses:
        '200':
          description: Authenticated; session token is only in Set-Cookie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {description: Rate limited; respect Retry-After}
    get:
      summary: Current user and CSRF token after reload
      responses:
        '200':
          description: Current session; never cache
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    delete:
      summary: Revoke current session
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: Session revoked and cookie expired}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/projects:
    get:
      summary: List up to 100 projects the current human belongs to
      responses:
        '200':
          description: Visible projects
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Project'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Create a project and its three environments
      description: Developer/admin only; creator becomes a member. Audited atomically.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/users:
    post:
      summary: Create an organization user (admin only)
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, role]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, minLength: 12, maxLength: 72, description: Limits apply to UTF-8 byte length for bcrypt}
                role: {type: string, enum: [viewer, developer, admin]}
      responses:
        '201':
          description: Created user; password never returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Actor'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Email already exists}
  /v1/projects/{project}/environments:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      summary: List development, staging and production identifiers
      responses:
        '200':
          description: Environments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: {type: string}
                    name: {type: string, enum: [development, staging, production]}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/projects/{project}/members:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      summary: Grant project membership (admin member only)
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id]
              properties:
                user_id: {type: string}
      responses:
        '204': {description: Membership created and audited}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Membership already exists}
  /v1/projects/{project}/application-keys:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      summary: Create a scoped application key (development/staging only in MVP)
      description: Token is returned once, stored only as a SHA-256 hash, and excluded from audit details.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, environment_id, permissions]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                environment_id: {type: string}
                permissions:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items: {type: string, enum: [evaluate, 'events:write', 'config:read']}
      responses:
        '201':
          description: One-time key response
          content:
            application/json:
              schema:
                type: object
                required: [id, token, permissions]
                properties:
                  id: {type: string}
                  token: {type: string}
                  permissions: {type: array, items: {type: string}}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/projects/{project}/application-keys/{key}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - name: key
        in: path
        required: true
        schema: {type: string}
    delete:
      summary: Revoke an application key (developer/admin member)
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: Revoked and audited}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Unknown or already revoked key}
  /v1/projects/{project}/audit:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      summary: List up to 100 audit records in descending ID order
      parameters:
        - name: before_id
          in: query
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Append-only application history
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/projects/{project}/flags:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      summary: List up to 100 configured flags in an environment
      parameters:
        - $ref: '#/components/parameters/EnvironmentQuery'
      responses:
        '200':
          description: Current immutable definitions
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FlagDefinition'}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create a boolean or JSON flag and its initial environment revision
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FlagCreate'}
      responses:
        '201':
          description: Created immutable revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlagDefinition'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Flag key already exists in project}
  /v1/projects/{project}/flags/{key}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/FlagKey'
    get:
      summary: Read the current flag definition
      parameters:
        - $ref: '#/components/parameters/EnvironmentQuery'
      responses:
        '200':
          description: Definition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlagDefinition'}
        '404': {description: Flag is not configured in this environment}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      summary: Append a revision with optimistic concurrency
      description: >-
        Full configuration replacement. expected_revision=0 initializes another
        development/staging environment for an existing project flag.
        Salt is server-fixed; production writes are denied in MVP.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FlagUpdate'}
      responses:
        '200':
          description: New immutable revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlagDefinition'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Stale revision or incompatible active experiment}
  /v1/projects/{project}/flags/{key}/preview:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/FlagKey'
    post:
      summary: Read-only human evaluation preview; never creates exposure
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EvaluationInput'}
      responses:
        '200':
          description: Evaluated decision; path determines project/key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationResult'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/evaluate:
    post:
      security:
        - application: []
      summary: Evaluate a flag using an environment-scoped application key
      description: >-
        No exposure or per-user database write. A known flag requires fallback
        to match its emergency safe value; unknown flags return the declared
        typed fallback. decision_id is correlation context, not proof of exposure.
        Application configuration reads use immutable snapshots with two-second
        re-verification and a strict thirty-second maximum authoritative age.
        Authorization and key revocation remain PostgreSQL-backed per request.
        Configuration expiry/outage returns 503 with the declared safe fallback,
        an explicit degraded reason, no experiment assignment and Retry-After.
        Human preview reads directly from PostgreSQL.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplicationEvaluationInput'}
      responses:
        '200':
          description: Typed decision or explicit missing-flag fallback
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationResult'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: Configuration refresh unavailable or saturated; typed safe fallback is included
          headers:
            Retry-After: {schema: {type: integer}, description: Suggested retry delay in seconds}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EvaluationResult'
                  - type: object
                    required: [error]
                    properties:
                      error: {type: string, enum: [configuration_unavailable]}
  /v1/projects/{project}/experiments:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      summary: List the 100 most recent runs in an environment
      parameters:
        - $ref: '#/components/parameters/EnvironmentQuery'
      responses:
        '200':
          description: Runs ordered by creation time descending
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ExperimentRun'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create a draft experiment with immutable population and treatments
      description: >-
        Developer/admin project members only, development/staging only in MVP.
        Requires an existing enabled flag configuration without a standalone rollout.
        Draft and paused runs reserve the flag/environment until completed.
        Creation does not start evaluation or change the flag revision.
        Request body is limited to 64 KiB.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExperimentCreate'}
      responses:
        '201':
          description: Draft created and audited atomically
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExperimentRun'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Flag configuration not found}
        '409': {description: Revision conflict or flag already reserved, killed or in standalone rollout}
  /v1/projects/{project}/experiments/{run}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Run'
    get:
      summary: Inspect a current or historical run
      responses:
        '200':
          description: Frozen run definition and current flag configuration revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExperimentRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Run not found in this project}
  /v1/projects/{project}/experiments/{run}/transitions:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Run'
    post:
      summary: Start, pause, resume or complete a run
      description: >-
        Use action start to resume a paused run. No treatment edits are accepted.
        Start/resume attaches the immutable experiment; pause/complete detaches it.
        Every successful transition creates a flag revision and audit record in one transaction.
        Completed runs cannot restart; killed flags cannot start/resume.
        Send configuration_revision as expected_revision, rather than definition.revision.
        Request body is limited to 4 KiB.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, action, reason]
              properties:
                expected_revision: {type: integer, minimum: 1}
                action: {type: string, enum: [start, pause, complete]}
                reason: {type: string, minLength: 1, maxLength: 512}
      responses:
        '200':
          description: Updated lifecycle and current configuration revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExperimentRun'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Run not found in this project}
        '409': {description: Stale revision, invalid state transition or disabled flag}
  /v1/projects/{project}/experiments/{run}/results:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Run'
    get:
      summary: Read exposure-attributed conversion results and product-request metrics
      description: >-
        Human project members, including viewers, may read current/historical runs.
        Earliest accepted event-time exposure per user/run anchors the 30-minute window;
        ties use event ID byte order. Outcomes require a valid matching referenced exposure.
        New completion IDs cannot increase a user's conversion count. Provisional cohorts
        mature only after the attribution window and 24-hour late allowance have elapsed.
        Future-dated accepted facts do not count before their event time. SQL reads one
        repeatable-read snapshot; no evaluation automatically becomes exposure.
        Product-request p95 is a histogram upper bound, not exact latency or API latency.
        Wilson 95% intervals describe each conversion rate. Two-proportion p-values require
        sufficient cell counts; sample-ratio mismatches suppress inference. These are
        descriptive fixed-analysis outputs, with no sequential stopping or multiplicity correction.
      responses:
        '200':
          description: Asynchronous durable aggregates with processing backlog in one database snapshot; never cache or automatically fall back to raw facts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExperimentResults'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Run not found in this project}
  /v1/events:
    post:
      security:
        - application: []
      summary: Commit a bounded batch of explicit measurement facts
      description: >-
        Requires a project/environment application key with events:write permission.
        Up to 100 events and 1 MiB per batch, with each normalized event at most 16 KiB.
        The entire batch commits before any receipt is returned. A conflicting reused ID
        returns 409 and rolls back new facts in that batch. Equivalent retries return the
        original receipt with duplicate=true. Event IDs are scoped to project/environment.
        Timestamp zones normalize to UTC and precision to microseconds; JSON object order
        and equivalent decimal numbers do not change identity. Events more than 24 hours
        late or 5 minutes in the future are stored in quarantine, as are assignment errors
        and nonrandomized decisions. Unknown run IDs and malformed schemas reject the batch.
        When no original receipt remains, events older than seven days reject the batch
        instead of creating a new fact. Original retained identity receipts are returned
        unchanged on duplicates; changing a known expired identity's timestamp is a conflict.
        Historical flag revision determines assignment, rather than current configuration.
        Outcomes may arrive before their referenced exposure; accepted does not mean counted
        as a conversion. Attribution waits for a valid matching exposure.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventBatch'}
      responses:
        '200':
          description: Durable per-event receipts in original input order
          content:
            application/json:
              schema:
                type: object
                required: [receipts]
                properties:
                  receipts: {type: array, items: {$ref: '#/components/schemas/EventReceipt'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Existing event identity has a different payload; no new batch facts commit}
        '503':
          description: Durable work capacity reached; no new batch facts commit. Retry with the same event IDs after the indicated delay.
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}, description: Suggested retry delay in seconds}
        '500': {description: Transaction failed; no successful acceptance is claimed; retry with stable IDs}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: switchyard_session}
    application: {type: http, scheme: bearer, bearerFormat: opaque-scoped-application-key}
  parameters:
    Project: {name: project, in: path, required: true, schema: {type: string}}
    Origin: {name: Origin, in: header, required: true, schema: {type: string}, description: Must equal configured SWITCHYARD_ORIGIN}
    CSRF: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}, description: Token from current session response}
    EnvironmentQuery: {name: environment_id, in: query, required: true, schema: {type: string}}
    FlagKey: {name: key, in: path, required: true, schema: {type: string}}
    Run: {name: run, in: path, required: true, schema: {type: string}}
  schemas:
    ConversionCounts:
      type: object
      required: [exposed, converted]
      properties:
        exposed: {type: integer, minimum: 0}
        converted: {type: integer, minimum: 0, description: Unique converted users, never greater than exposed}
    ConversionRate:
      type: object
      required: [status, rate, confidence_interval]
      properties:
        status: {type: string, enum: [available, insufficient_data, invalid_counts]}
        rate: {type: [number, 'null'], minimum: 0, maximum: 1}
        confidence_interval:
          anyOf:
            - type: 'null'
            - type: object
              required: [method, level, lower, upper]
              properties:
                method: {const: wilson}
                level: {const: 0.95}
                lower: {type: number, minimum: 0, maximum: 1}
                upper: {type: number, minimum: 0, maximum: 1}
    RequestMetrics:
      type: object
      required: [count, errors, error_rate, p95_upper_bound_ms, histogram]
      properties:
        count: {type: integer, minimum: 0}
        errors: {type: integer, minimum: 0}
        error_rate: {type: [number, 'null'], minimum: 0, maximum: 1}
        p95_upper_bound_ms: {type: [integer, 'null'], description: Nearest-rank p95 enclosed by a fixed histogram bucket}
        histogram:
          type: array
          items:
            type: object
            required: [upper_bound_ms, count]
            properties:
              upper_bound_ms: {type: integer, enum: [50, 100, 250, 500, 1000, 2500, 5000, 10000, 60000]}
              count: {type: integer, minimum: 0, description: Per-bin count; not cumulative}
    SampleRatio:
      type: object
      required: [status, statistic, degrees_of_freedom, p_value, warning_threshold]
      properties:
        status: {type: string, enum: [balanced, mismatch, insufficient_data]}
        statistic: {type: [number, 'null'], minimum: 0}
        degrees_of_freedom: {type: integer, minimum: 1, maximum: 9}
        p_value: {type: [number, 'null'], minimum: 0, maximum: 1}
        warning_threshold: {const: 0.0005}
    ConversionComparison:
      type: object
      required: [status, absolute_lift, relative_lift, z_statistic, p_value]
      properties:
        status: {type: string, enum: [available, insufficient_data, data_quality_warning, invalid_counts]}
        reason: {type: string}
        absolute_lift: {type: [number, 'null'], description: Treatment rate minus control rate, in rate units}
        relative_lift: {type: [number, 'null'], description: Absolute lift divided by control rate; null when control rate is zero}
        relative_lift_reason: {type: string}
        z_statistic: {type: [number, 'null']}
        p_value: {type: [number, 'null'], minimum: 0, maximum: 1}
    ExperimentResults:
      type: object
      required: [run_id, environment_id, control_variant_id, as_of, processing, attribution_window_seconds, late_allowance_seconds, variants, quality, sample_ratio, comparisons, inference_notes]
      properties:
        run_id: {type: string}
        environment_id: {type: string}
        control_variant_id: {type: string}
        as_of: {type: string, format: date-time}
        processing:
          type: object
          description: Outstanding event receipts and currently due user updates. Latest reconciliation is a latest update, not a completeness watermark. Lag is the age of oldest pending receipt/due time at the read snapshot.
          required: [pending_events, due_users, oldest_pending_at, latest_reconciled_at, lag_seconds]
          properties:
            pending_events: {type: integer, minimum: 0}
            due_users: {type: integer, minimum: 0}
            oldest_pending_at: {type: [string, 'null'], format: date-time}
            latest_reconciled_at: {type: [string, 'null'], format: date-time}
            lag_seconds: {type: number, minimum: 0}
        attribution_window_seconds: {const: 1800}
        late_allowance_seconds: {const: 86400}
        variants:
          type: array
          items:
            type: object
            required: [id, weight_bp, provisional, finalized, total, provisional_rate, finalized_rate, total_rate, requests]
            properties:
              id: {type: string}
              weight_bp: {type: integer, minimum: 1, maximum: 10000}
              provisional: {$ref: '#/components/schemas/ConversionCounts'}
              finalized: {$ref: '#/components/schemas/ConversionCounts'}
              total: {$ref: '#/components/schemas/ConversionCounts'}
              provisional_rate: {$ref: '#/components/schemas/ConversionRate'}
              finalized_rate: {$ref: '#/components/schemas/ConversionRate'}
              total_rate: {$ref: '#/components/schemas/ConversionRate'}
              requests: {$ref: '#/components/schemas/RequestMetrics'}
        quality:
          type: object
          required: [quarantined_events, future_events, pending_outcomes, invalid_reference_outcomes, outside_window_completions, duplicate_attributed_completions]
          properties:
            quarantined_events: {type: integer, minimum: 0}
            future_events: {type: integer, minimum: 0}
            pending_outcomes: {type: integer, minimum: 0}
            invalid_reference_outcomes: {type: integer, minimum: 0}
            outside_window_completions: {type: integer, minimum: 0}
            duplicate_attributed_completions: {type: integer, minimum: 0}
        sample_ratio:
          type: object
          required: [provisional, finalized, total]
          properties:
            provisional: {$ref: '#/components/schemas/SampleRatio'}
            finalized: {$ref: '#/components/schemas/SampleRatio'}
            total: {$ref: '#/components/schemas/SampleRatio'}
        comparisons:
          type: array
          items:
            type: object
            required: [control_variant_id, variant_id, provisional, finalized, total]
            properties:
              control_variant_id: {type: string}
              variant_id: {type: string}
              provisional: {$ref: '#/components/schemas/ConversionComparison'}
              finalized: {$ref: '#/components/schemas/ConversionComparison'}
              total: {$ref: '#/components/schemas/ConversionComparison'}
        inference_notes: {type: array, items: {type: string}}
    EventBatch:
      type: object
      additionalProperties: false
      required: [project_id, environment_id, events]
      properties:
        project_id: {type: string}
        environment_id: {type: string}
        events: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/MeasurementEvent'}}
    MeasurementEvent:
      type: object
      additionalProperties: false
      required: [event_id, kind, run_id, user_id, revision, decision_reason, occurred_at]
      properties:
        event_id: {type: string, pattern: '^[a-zA-Z0-9_-]{1,128}$'}
        kind: {type: string, enum: [exposure, listing_completion, request_outcome]}
        run_id: {type: string, minLength: 1, maxLength: 128}
        user_id: {type: string, minLength: 1, maxLength: 256, description: Stable synthetic user ID; byte length is enforced}
        variant_id: {type: string, maxLength: 128}
        revision: {type: integer, minimum: 1}
        decision_id: {type: string, pattern: '^[a-zA-Z0-9_-]{1,128}$', description: Evaluation correlation ID, not public assignment proof}
        decision_reason: {type: string, enum: [experiment, targeting, default, kill_switch]}
        exposure_id: {type: string, pattern: '^[a-zA-Z0-9_-]{1,128}$', description: Event ID of the rendered exposure; it may arrive later}
        occurred_at: {type: string, format: date-time, description: Event time, normalized to UTC microsecond precision}
        attributes:
          type: [object, 'null']
          maxProperties: 100
          additionalProperties: {}
          description: Copy non-sensitive evaluation attributes; each serialized value is at most 1 KiB, with bounded JSON numbers
        is_error: {type: boolean, description: Listing-operation error, not platform API error}
        latency_ms: {type: number, minimum: 0, maximum: 60000, description: Listing-operation duration in milliseconds}
      allOf:
        - if:
            properties:
              kind: {const: exposure}
          then:
            required: [decision_id]
            properties:
              exposure_id: false
              is_error: false
              latency_ms: false
          else:
            required: [exposure_id]
            properties:
              decision_id: false
        - if:
            properties:
              kind: {const: request_outcome}
          then:
            required: [is_error, latency_ms]
          else:
            properties:
              is_error: false
              latency_ms: false
        - if:
            properties:
              decision_reason: {const: experiment}
          then:
            required: [variant_id]
            properties:
              variant_id: {minLength: 1}
    EventReceipt:
      type: object
      required: [event_id, status, duplicate]
      properties:
        event_id: {type: string}
        status: {type: string, enum: [accepted, quarantined]}
        reason:
          type: string
          enum: [too_late, future_timestamp, unknown_revision, revision_run_mismatch, invalid_configuration, invalid_context, non_randomized_exposure, assignment_mismatch]
        duplicate: {type: boolean}
    Variant:
      type: object
      additionalProperties: false
      required: [id, ordinal, weight_bp, value]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        ordinal: {type: integer, minimum: 0}
        weight_bp: {type: integer, minimum: 1, maximum: 10000}
        value: {$ref: '#/components/schemas/FlagValue'}
      description: Unique IDs and ordinals; all weights must sum to 10000; values match the flag type
    ExperimentAssignment:
      type: object
      required: [run_id, eligibility_salt, variant_salt, traffic_bp, variants]
      properties:
        run_id: {type: string}
        eligibility_salt: {type: string}
        variant_salt: {type: string}
        traffic_bp: {type: integer, minimum: 0, maximum: 10000}
        variants: {type: array, minItems: 2, maxItems: 10, items: {$ref: '#/components/schemas/Variant'}}
    ExperimentCreate:
      type: object
      additionalProperties: false
      required: [environment_id, flag_key, expected_revision, name, control_variant_id, traffic_bp, variants, reason]
      properties:
        environment_id: {type: string}
        flag_key: {type: string}
        expected_revision: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 128}
        control_variant_id: {type: string, description: Must identify one supplied variant}
        traffic_bp: {type: integer, minimum: 0, maximum: 10000}
        variants: {type: array, minItems: 2, maxItems: 10, items: {$ref: '#/components/schemas/Variant'}}
        reason: {type: string, minLength: 1, maxLength: 512}
    ExperimentRun:
      type: object
      required: [id, name, state, control_variant_id, definition, configuration_revision, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        state: {type: string, enum: [draft, running, paused, completed]}
        control_variant_id: {type: string}
        definition: {$ref: '#/components/schemas/FlagDefinition'}
        configuration_revision: {type: integer, minimum: 1, description: Current flag revision to send in a lifecycle mutation}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
      description: Definition is immutable and includes the run assignment; its revision is the original creation revision
    FlagValue:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, data]
          properties:
            type: {const: boolean}
            data: {type: boolean}
        - type: object
          additionalProperties: false
          required: [type, data]
          properties:
            type: {const: json}
            data: {}
      description: Explicit typed value; at most 16 KiB of serialized JSON data
    TargetRule:
      type: object
      additionalProperties: false
      required: [attribute, operator, values, value]
      properties:
        attribute: {type: string, maxLength: 64}
        operator: {type: string, enum: [eq, in, gt, gte, lt, lte]}
        values:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: [string, boolean, number]}
        value: {$ref: '#/components/schemas/FlagValue'}
      description: Ordered primitive targeting; sensitive attribute names are denied
    Rollout:
      type: object
      additionalProperties: false
      required: [traffic_bp, value]
      properties:
        traffic_bp: {type: integer, minimum: 0, maximum: 10000}
        salt: {type: string, description: Omit or use standalone-v1; server fixes this across revisions}
        value: {$ref: '#/components/schemas/FlagValue'}
    FlagConfiguration:
      type: object
      required: [default, safe]
      properties:
        default: {$ref: '#/components/schemas/FlagValue'}
        safe: {$ref: '#/components/schemas/FlagValue'}
        killed: {type: boolean, default: false}
        rules: {type: [array, 'null'], maxItems: 50, items: {$ref: '#/components/schemas/TargetRule'}}
        rollout:
          anyOf:
            - $ref: '#/components/schemas/Rollout'
            - type: 'null'
    FlagCreate:
      allOf:
        - $ref: '#/components/schemas/FlagConfiguration'
        - type: object
          required: [environment_id, key, type, reason]
          properties:
            environment_id: {type: string}
            key: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
            type: {type: string, enum: [boolean, json]}
            reason: {type: string, minLength: 1, maxLength: 512}
      unevaluatedProperties: false
    FlagUpdate:
      allOf:
        - $ref: '#/components/schemas/FlagConfiguration'
        - type: object
          required: [environment_id, expected_revision, reason]
          properties:
            environment_id: {type: string}
            expected_revision: {type: integer, minimum: 0}
            reason: {type: string, minLength: 1, maxLength: 512}
      unevaluatedProperties: false
    FlagDefinition:
      allOf:
        - $ref: '#/components/schemas/FlagConfiguration'
        - type: object
          required: [project_id, environment_id, flag_id, key, type, revision]
          properties:
            project_id: {type: string}
            environment_id: {type: string}
            flag_id: {type: string}
            key: {type: string}
            type: {type: string, enum: [boolean, json]}
            revision: {type: integer, minimum: 1}
            experiment: {$ref: '#/components/schemas/ExperimentAssignment'}
    EvaluationInput:
      type: object
      additionalProperties: false
      required: [environment_id, user_id, fallback]
      properties:
        project_id: {type: string, description: Required for application evaluation; preview uses path}
        key: {type: string, description: Required for application evaluation; preview uses path}
        environment_id: {type: string}
        user_id: {type: string, minLength: 1, maxLength: 256}
        attributes: {type: [object, 'null'], maxProperties: 100, additionalProperties: {}}
        fallback: {$ref: '#/components/schemas/FlagValue'}
    EvaluationResult:
      type: object
      required: [value, reason, revision, decision_id]
      properties:
        value: {$ref: '#/components/schemas/FlagValue'}
        reason: {type: string, enum: [kill_switch, targeting, experiment, rollout, default, flag_not_found, cache_expired, cache_unavailable]}
        revision: {type: integer, minimum: 0}
        decision_id: {type: string}
        run_id: {type: string}
        variant_id: {type: string}
    ApplicationEvaluationInput:
      allOf:
        - $ref: '#/components/schemas/EvaluationInput'
        - type: object
          required: [project_id, key]
    Actor:
      type: object
      required: [id, email, role]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [viewer, developer, admin]}
    Session:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user: {$ref: '#/components/schemas/Actor'}
        csrf_token: {type: string}
        expires_at: {type: string, format: date-time}
    Project:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    AuditEntry:
      type: object
      required: [id, actor_id, source, project_id, action, request_id, reason, details, created_at]
      properties:
        id: {type: integer}
        actor_id: {type: string}
        source: {type: string, enum: [human, application, system, agent]}
        project_id: {type: string}
        environment_id: {type: string}
        action: {type: string}
        request_id: {type: string}
        reason: {type: string}
        before_revision: {type: integer}
        after_revision: {type: integer}
        details: {type: object}
        created_at: {type: string, format: date-time}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        request_id: {type: string}
  responses:
    Unauthorized:
      description: Invalid, expired or revoked session
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Permission, origin, CSRF or scope denied
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Invalid:
      description: Invalid input; unknown JSON fields, multiple documents and null bodies are rejected
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
