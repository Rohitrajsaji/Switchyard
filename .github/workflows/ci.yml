name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-install web-check
  go:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.10.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: switchyard_test
          POSTGRES_USER: switchyard
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U switchyard -d switchyard_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check race
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: make api-check
      - run: >-
          docker run -d --name switchyard-ci-nats -p 4222:4222
          --health-cmd 'wget -q -O /dev/null http://127.0.0.1:8222/healthz'
          --health-interval 2s --health-timeout 3s --health-retries 30
          nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
          -js -sd /data -m 8222
      - name: Wait for durable NATS
        run: |
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' switchyard-ci-nats)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs switchyard-ci-nats
          exit 1
      - run: make integration
        env:
          TEST_DATABASE_URL: postgres://switchyard:ci-only-password@localhost:5432/switchyard_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
          TEST_NATS_URL: nats://localhost:4222
