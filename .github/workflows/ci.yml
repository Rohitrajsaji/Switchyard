name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-install web-check
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: switchyard_test
          POSTGRES_USER: switchyard
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U switchyard -d switchyard_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check race
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: make api-check
      - run: make integration
        env:
          TEST_DATABASE_URL: postgres://switchyard:ci-only-password@localhost:5432/switchyard_test?sslmode=disable
